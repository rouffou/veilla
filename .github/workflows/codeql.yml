# Analyse statique de sécurité CodeQL (CTR-20 : analyse de code).
# Le dépôt étant privé, le code scanning nécessite GitHub Advanced Security (Code Security) :
# le job ne s'exécute que si la variable de dépôt CODE_SCANNING_ENABLED vaut « true ».
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/codeql.yml"
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # chaque lundi, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Porte de fusion (protection de main) : le workflow se déclenche sur toutes les PR ; ce job
  # détermine si la PR touche les chemins concernés, sinon les jobs sont ignorés et « Statut CodeQL » reste vert.
  changements:
    name: Détection des changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    outputs:
      concerne: ${{ steps.filtre.outputs.concerne }}
    steps:
      - name: Récupération des sources
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Chemins modifiés par la PR
        id: filtre
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MOTIF: '^src/|^tests/|^\.github/workflows/codeql\.yml$'
        run: |
          if [ "$EVENEMENT" != "pull_request" ]; then
            echo "concerne=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE "$MOTIF"; then
            echo "concerne=true" >> "$GITHUB_OUTPUT"
          else
            echo "concerne=false" >> "$GITHUB_OUTPUT"
            echo "Aucun chemin concerné : jobs ignorés."
          fi

  analyse:
    name: Analyse CodeQL (${{ matrix.language }})
    needs: changements
    if: ${{ needs.changements.outputs.concerne == 'true' && vars.CODE_SCANNING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode none : analyse sans compilation (supporté pour C# et JS/TS).
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Récupération des sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialisation de CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/Migrations/**"

      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # Seul contrôle exigé par la règle de protection de main (noms stables, quel que soit le nombre de jobs de matrice).
  statut:
    name: Statut CodeQL
    if: ${{ always() }}
    needs: [changements, analyse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Résultat des jobs
        env:
          RESULTATS: ${{ toJson(needs.*.result) }}
        run: |
          echo "$RESULTATS"
          if echo "$RESULTATS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::Au moins un job a échoué ou a été annulé."
            exit 1
          fi
