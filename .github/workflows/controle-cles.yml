# Contrôle bloquant des changements de clés de chiffrement (#474, ADR 0012).
#   Toute PR qui modifie encryption_key_ids ou encryption_legacy_key_ids (ou leur branchement) dans
#   infra/environments/<env>/*.tfvars ou *.tf exige, pour chaque environnement touché, une exécution RÉUSSIE de
#   verification-cles.yml, lancée à la main sur main pour cet environnement, de moins de 24 h (décision D5).
#   Ce workflow n'utilise AUCUN environnement GitHub, AUCUN id-token et AUCUN secret : il lit seulement l'API GitHub avec le
#   GITHUB_TOKEN de la PR (actions: read). Il n'a donc aucun accès à Azure, et le code d'une PR ne s'exécute jamais avec
#   l'identité de déploiement : la vérification elle-même ne tourne que depuis main, dans des environnements restreints à
#   main (preprod et prod exigent en plus l'approbation du responsable produit).
#   Le statut « Statut contrôle des clés » est exigé par le ruleset de main (comme « Statut Terraform ») : il passe tout de
#   suite quand aucune clé ne change, et reste rouge tant qu'aucune vérification récente n'est trouvée. Après avoir
#   lancé la vérification, relancer ce contrôle (Re-run jobs).
#   Scripts : ceux de la BRANCHE DE BASE (main), jamais ceux de la PR. La PR n'est récupérée que pour en lire le diff ; aucun
#   fichier de la PR n'est exécuté (voir la description de la PR #506). Limite : le fichier de workflow lui-même est celui de
#   la PR (évènement pull_request) ; la revue des fichiers .github/workflows/ reste donc nécessaire.
#   Dans la file de fusion (merge_group), la vérification faite sur la PR fait foi.
name: Contrôle des clés

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read # lecture des exécutions de verification-cles.yml

concurrency:
  group: controle-cles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controle:
    name: Contrôle des clés
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Scripts de confiance : la base de la PR (main), dans « base/ ».
      - name: Récupération des scripts de main
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # La PR (fusion avec main) n'est lue que pour son diff, dans « pr/ » ; rien n'y est exécuté.
      - name: Récupération de la PR (diff seulement)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Environnements dont les clés de chiffrement changent
        id: detection
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: pr
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          environnements=$(bash "$GITHUB_WORKSPACE/base/tools/deploy/detecter-modification-cles.sh" "$BASE" HEAD | tr '\n' ' ')
          echo "Environnements dont les clés changent : ${environnements:-aucun}"
          echo "environnements=$environnements" >> "$GITHUB_OUTPUT"

      - name: Vérification récente sur main (moins de 24 h)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ENVIRONNEMENTS: ${{ steps.detection.outputs.environnements }}
          GH_TOKEN: ${{ github.token }}
        run: bash base/tools/deploy/controler-verification-recente.sh

      - name: File de fusion
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "File de fusion, la vérification faite sur la PR fait foi."

  # Seul contrôle exigé par le ruleset de main (nom stable).
  statut:
    name: Statut contrôle des clés
    if: ${{ always() }}
    needs: [controle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Résultat
        env:
          RESULTAT: ${{ needs.controle.result }}
        run: |
          echo "$RESULTAT"
          if [ "$RESULTAT" != "success" ]; then
            echo "::error::Contrôle des clés en échec : aucun changement de clés sans vérification récente (verification-cles.yml sur main)."
            exit 1
          fi
