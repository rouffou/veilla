# Intégration continue des fronts Angular (ADR 0006, CTR-20) : lint (dont règles
# d'accessibilité des templates), tests unitaires Vitest, build de production des trois
# applications, audit des dépendances npm (CTR-06).
name: Fronts

on:
  push:
    branches: [main]
    paths:
      - "src/Frontends/**"
      - ".github/workflows/frontend.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: src/Frontends/veilla-web

env:
  NG_CLI_ANALYTICS: "false"

jobs:
  # Porte de fusion (protection de main) : le workflow se déclenche sur toutes les PR ; ce job
  # détermine si la PR touche les chemins concernés, sinon les jobs sont ignorés et « Statut fronts » reste vert.
  changements:
    name: Détection des changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    outputs:
      concerne: ${{ steps.filtre.outputs.concerne }}
    steps:
      - name: Récupération des sources
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Chemins modifiés par la PR
        id: filtre
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MOTIF: '^src/Frontends/|^\.github/workflows/frontend\.yml$'
        run: |
          if [ "$EVENEMENT" != "pull_request" ]; then
            echo "concerne=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE "$MOTIF"; then
            echo "concerne=true" >> "$GITHUB_OUTPUT"
          else
            echo "concerne=false" >> "$GITHUB_OUTPUT"
            echo "Aucun chemin concerné : jobs ignorés."
          fi

  verification:
    name: Lint, tests et build
    needs: changements
    if: ${{ needs.changements.outputs.concerne == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Récupération des sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation de Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Frontends/veilla-web/package-lock.json

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test:ci

      - name: Build de production (3 applications)
        run: npm run build

      # Échec sur vulnérabilité critique des dépendances de production (CTR-06).
      - name: Audit des dépendances npm
        run: npm audit --omit=dev --audit-level=critical

  # Seul contrôle exigé par la règle de protection de main (noms stables, quel que soit le nombre de jobs de matrice).
  statut:
    name: Statut fronts
    if: ${{ always() }}
    needs: [changements, verification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Résultat des jobs
        env:
          RESULTATS: ${{ toJson(needs.*.result) }}
        run: |
          echo "$RESULTATS"
          if echo "$RESULTATS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::Au moins un job a échoué ou a été annulé."
            exit 1
          fi
