# Vérification de l'infrastructure as code (ADR 0007, ARC-51, CTR-21) :
# terraform fmt, terraform validate par répertoire (environnements et modules), tflint.
# Aucun accès Azure ni état distant : init -backend=false.
name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Version épinglée (contrainte des modules : >= 1.9.0, < 2.0.0) ; surcharge possible
  # par la variable de dépôt TERRAFORM_VERSION.
  TF_VERSION: ${{ vars.TERRAFORM_VERSION || '1.16.4' }}
  TFLINT_VERSION: v0.64.0
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # Porte de fusion (protection de main) : le workflow se déclenche sur toutes les PR ; ce job
  # détermine si la PR touche les chemins concernés, sinon les jobs sont ignorés et « Statut Terraform » reste vert.
  changements:
    name: Détection des changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    outputs:
      concerne: ${{ steps.filtre.outputs.concerne }}
    steps:
      - name: Récupération des sources
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Chemins modifiés par la PR
        id: filtre
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MOTIF: '^infra/|^\.github/workflows/terraform\.yml$'
        run: |
          if [ "$EVENEMENT" != "pull_request" ]; then
            echo "concerne=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE "$MOTIF"; then
            echo "concerne=true" >> "$GITHUB_OUTPUT"
          else
            echo "concerne=false" >> "$GITHUB_OUTPUT"
            echo "Aucun chemin concerné : jobs ignorés."
          fi

  format:
    name: Formatage Terraform
    needs: changements
    if: ${{ needs.changements.outputs.concerne == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      repertoires: ${{ steps.discover.outputs.repertoires }}
    steps:
      - name: Récupération des sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff infra

      # Tous les répertoires contenant du .tf (racine, infra/environments/*, infra/modules/*…).
      - name: Découverte des répertoires Terraform
        id: discover
        run: |
          set -euo pipefail
          dirs=$(find infra -type f -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u | jq -R . | jq -cs .)
          echo "Répertoires : $dirs"
          echo "repertoires=$dirs" >> "$GITHUB_OUTPUT"

  validate:
    name: Validation ${{ matrix.repertoire }}
    needs: format
    if: ${{ needs.format.outputs.repertoires != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repertoire: ${{ fromJSON(needs.format.outputs.repertoires) }}
    steps:
      - name: Récupération des sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Cache des fournisseurs Terraform
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/**/versions.tf', 'infra/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: terraform init -backend=false
        working-directory: ${{ matrix.repertoire }}
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.repertoire }}
        run: terraform validate -no-color

  tflint:
    name: Analyse tflint
    needs: changements
    if: ${{ needs.changements.outputs.concerne == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Récupération des sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache des greffons tflint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ env.TFLINT_VERSION }}-${{ hashFiles('infra/.tflint.hcl') }}

      - name: Installation de tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # Configuration du dépôt (infra/.tflint.hcl) si elle existe, sinon configuration
      # par défaut : règles Terraform recommandées + jeu de règles azurerm.
      - name: Configuration tflint
        working-directory: infra
        run: |
          if [ -f .tflint.hcl ]; then
            echo "TFLINT_CFG=$PWD/.tflint.hcl" >> "$GITHUB_ENV"
          else
            cfg="$RUNNER_TEMP/tflint.hcl"
            cat > "$cfg" <<'HCL'
          plugin "terraform" {
            enabled = true
            preset  = "recommended"
          }
          plugin "azurerm" {
            enabled = true
            version = "0.32.0"
            source  = "github.com/terraform-linters/tflint-ruleset-azurerm"
          }
          HCL
            echo "TFLINT_CFG=$cfg" >> "$GITHUB_ENV"
          fi

      - name: tflint --init
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # évite la limitation de débit de l'API GitHub
        run: tflint --init --config "$TFLINT_CFG"

      # Les avertissements sont affichés ; seules les erreurs font échouer le job.
      - name: tflint
        working-directory: infra
        run: tflint --recursive --config "$TFLINT_CFG" --format compact --minimum-failure-severity=error

  # Seul contrôle exigé par la règle de protection de main (noms stables, quel que soit le nombre de jobs de matrice).
  statut:
    name: Statut Terraform
    if: ${{ always() }}
    needs: [changements, format, validate, tflint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Résultat des jobs
        env:
          RESULTATS: ${{ toJson(needs.*.result) }}
        run: |
          echo "$RESULTATS"
          if echo "$RESULTATS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::Au moins un job a échoué ou a été annulé."
            exit 1
          fi
