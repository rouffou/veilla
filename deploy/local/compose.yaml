# Environnement local complet pour les développeurs (CTR-23) — données fictives uniquement (NF-14).
#   docker compose -f deploy/local/compose.yaml up -d --build
# Voir deploy/local/README.md.
name: veilla

x-service-defaults: &service-defaults
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sepp
      POSTGRES_PASSWORD: sepp-local-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sepp"]
      interval: 5s
      retries: 20

  keycloak:
    # Fournisseur OIDC local, remplacé par Entra ID + CSAM hors poste de développement (ADR 0005).
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-dev
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/veilla-realm.json:/opt/keycloak/data/import/veilla-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30

  otel-dashboard:
    # Traces, journaux et métriques OpenTelemetry (ARC-47) : http://localhost:18888
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

  referentiels:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Referentiels/Dockerfile
    image: sepp/referentiels:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Referentiels: Host=postgres;Database=referentiels;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5110:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  audit:
    # Journal d'audit infalsifiable (NF-04). Sans bus configuré, les traces ne lui parviennent pas (ADR 0004).
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Audit/Dockerfile
    image: sepp/audit:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Audit: Host=postgres;Database=audit;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5114:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  affilies:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Affilies/Dockerfile
    image: sepp/affilies:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Affilies: Host=postgres;Database=affilies;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5111:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  personnes:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Personnes/Dockerfile
    image: sepp/personnes:local
    environment:
      # Environnement Development : clés de chiffrement et d'index aveugle de développement (appsettings.Development.json).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Personnes: Host=postgres;Database=personnes;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5112:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  postes-risques:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/PostesRisques/Dockerfile
    image: sepp/postes-risques:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostesRisques: Host=postgres;Database=postes_risques;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5113:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  obligations:
    # Moteur d'échéances de surveillance de la santé (SAN-01 à SAN-04, AFF-32) : projections locales alimentées par événements.
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Obligations/Dockerfile
    image: sepp/obligations:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Obligations: Host=postgres;Database=obligations;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5116:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  bff-employeur:
    # BFF du portail employeur (ARC-43) : sans base ; propage le jeton de l'utilisateur aux services (ARC-40).
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Bff/Employeur/Dockerfile
    image: sepp/bff-employeur:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      ServicesAval__Affilies: http://affilies:8080
      ServicesAval__Personnes: http://personnes:8080
      ServicesAval__PostesRisques: http://postes-risques:8080
      Cors__Origines__0: http://localhost:8082
      Cors__Origines__1: http://localhost:4201
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5200:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      affilies:
        condition: service_started
      personnes:
        condition: service_started
      postes-risques:
        condition: service_started

  integrations:
    # Couche anti-corruption vers les organismes (§12). En local : simulateurs (données fictives) et traitements
    # planifiés désactivés ; flux lancés par l'API d'administration (appsettings.Development.json).
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Integrations/Dockerfile
    image: sepp/integrations:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Integrations: Host=postgres;Database=integrations;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      # Appels internes vers Personnes (AFF-20) avec le compte technique du realm local (secret de développement uniquement ;
      # hors poste de développement, le secret vient de Key Vault).
      Integrations__Personnes__BaseAddress: http://personnes:8080/
      Integrations__Personnes__TokenEndpoint: http://keycloak:8080/realms/veilla/protocol/openid-connect/token
      Integrations__Personnes__ClientId: veilla-integrations
      Integrations__Personnes__ClientSecret: integrations-local-dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5115:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  surveillance-medicale:
    # Zone médicale (ARC-04) : base et clés de chiffrement propres (ZoneMedicale:Encryption, clé de développement dans
    # appsettings.Development.json). Signature qualifiée, Fedris et canal de transfert : simulateurs (données fictives).
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/SurveillanceMedicale/Dockerfile
    image: sepp/surveillance-medicale:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SurveillanceMedicale: Host=postgres;Database=surveillance_medicale;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5118:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  planification:
    # Agendas, créneaux, rendez-vous et convocations (§8, SAN-10 à SAN-13). En local : simulateurs de l'outil RH et des
    # agendas externes, tâches planifiées (rappels J-7 / J-1) désactivées ; rappels lancés par l'API (appsettings.Development.json).
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Planification/Dockerfile
    image: sepp/planification:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Planification: Host=postgres;Database=planification;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5117:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  documents:
    # Modèles, génération PDF/A, archivage chiffré par zone (DOC-01, DOC-02, NF-21). En local : stockage sur fichiers
    # (tmpfs, perdu à l'arrêt), horodatage et signature simulés (sans valeur probante), clés de développement.
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Documents/Dockerfile
    image: sepp/documents:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Documents: Host=postgres;Database=documents;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      Documents__Stockage__Racine: /tmp/sepp-documents
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5119:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  communications:
    # Messages et preuves d'envoi (DOC-03 à DOC-05). En local : tous les canaux et l'annuaire sont simulés (aucun envoi
    # réel) ; dirigeants alertés des bris de glace fictifs (appsettings.Development.json).
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Communications/Dockerfile
    image: sepp/communications:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Communications: Host=postgres;Database=communications;Username=sepp;Password=sepp-local-dev
      Database__MigrateOnStartup: "true"
      Authentication__Authority: http://localhost:8180/realms/veilla
      Authentication__MetadataAddress: http://keycloak:8080/realms/veilla/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8180/realms/veilla
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-dashboard:18889
    ports:
      - "5120:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  app-interne:
    <<: *service-defaults
    build:
      context: ../../src/Frontends/veilla-web
      args:
        APP: app-interne
    image: sepp/app-interne:local
    environment:
      VEILLA_API_BASE_URL: http://localhost:5100
      VEILLA_OIDC_AUTHORITY: http://localhost:8180/realms/veilla
      VEILLA_OIDC_CLIENT_ID: veilla-interne
    ports:
      - "8081:8080"

  portail-employeur:
    <<: *service-defaults
    build:
      context: ../../src/Frontends/veilla-web
      args:
        APP: portail-employeur
    image: sepp/portail-employeur:local
    environment:
      VEILLA_API_BASE_URL: http://localhost:5200
      VEILLA_OIDC_AUTHORITY: http://localhost:8180/realms/veilla
      VEILLA_OIDC_CLIENT_ID: veilla-portail-employeur
    ports:
      - "8082:8080"

  portail-travailleur:
    <<: *service-defaults
    build:
      context: ../../src/Frontends/veilla-web
      args:
        APP: portail-travailleur
    image: sepp/portail-travailleur:local
    environment:
      VEILLA_API_BASE_URL: http://localhost:5300
      VEILLA_OIDC_AUTHORITY: http://localhost:8180/realms/veilla
      VEILLA_OIDC_CLIENT_ID: veilla-portail-travailleur
    ports:
      - "8083:8080"

volumes:
  postgres-data:
