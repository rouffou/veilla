# Serveur statique d'une application Angular Veilla (nginx non root, port 8080).
# Les en-têtes de sécurité sont générés au démarrage (CSP dépendant de l'environnement) :
# voir /docker-entrypoint.d/40-veilla-runtime-config.sh.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # En-têtes de sécurité (CSP, nosniff, Referrer-Policy, etc.). `expires` n'utilise pas
    # add_header : les en-têtes ci-dessous restent hérités par toutes les locations.
    include /tmp/veilla/security-headers.conf;

    # Sondes de santé (CTR-15).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Configuration d'exécution générée au démarrage (CTR-05) : jamais mise en cache.
    location = /assets/config.json {
        alias /tmp/veilla/config.json;
        default_type application/json;
        expires -1;
    }

    # Page d'entrée : toujours revalidée pour prendre en compte un nouveau déploiement.
    location = /index.html {
        expires -1;
    }

    # Traductions et manifeste (noms non hachés) : cache court.
    location ~* ^/(i18n/.*\.json|manifest\.webmanifest)$ {
        expires 5m;
    }

    # Ressources hachées par le build : cache long.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Repli SPA : toute autre route est servie par index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
